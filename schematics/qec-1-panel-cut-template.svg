<svg xmlns="http://www.w3.org/2000/svg" width="600mm" height="420mm" viewBox="0 0 600 420">
  <title>QEC-1 full-scale panel cutting and engraving template</title>
  <desc>Print or export at exactly 100 percent. Red geometry is cut. Blue geometry is engraving. Verify the 100 millimeter calibration bar before fabrication.</desc>
  <style>
    .cut{fill:none;stroke:#f00;stroke-width:.2}.engrave{fill:none;stroke:#06c;stroke-width:.2}.label{fill:#06c;font:3px sans-serif}.tiny{fill:#06c;font:2px sans-serif}.address{fill:#06c;font:1.8px monospace;text-anchor:middle}.guide{fill:none;stroke:#999;stroke-width:.1;stroke-dasharray:2 2}
  </style>
  <rect class="cut" x="0.5" y="0.5" width="599" height="419" rx="2"/>
  <path class="engrave" d="M20 18h100M20 15v6M120 15v6"/>
  <text class="label" x="20" y="13">100 mm calibration — reject output if measured length differs</text>
  <text class="label" x="20" y="28">QEC-1 PANEL / 600 × 420 × 3 mm / CUT RED / ENGRAVE BLUE / REV 0.1</text>
  <rect class="guide" x="55" y="38" width="250" height="365" rx="4"/>
  <text class="label" x="58" y="398">TREE / PATH FIELD</text>
  <rect class="guide" x="375" y="48" width="210" height="75" rx="4"/>
  <text class="label" x="378" y="119">REGISTER FIELD / ADDRESSES 33–55</text>
  <rect class="cut" x="393" y="171" width="134" height="92" rx="1"/>
  <circle class="cut" cx="386" cy="164" r="1.6"/><circle class="cut" cx="534" cy="164" r="1.6"/>
  <circle class="cut" cx="386" cy="270" r="1.6"/><circle class="cut" cx="534" cy="270" r="1.6"/>
  <text class="label" x="393" y="268">KEY-BAY APERTURE / FIT 150 × 108 × 1.5 mm SUBPLATE BELOW</text>
  <rect class="cut" x="555" y="340" width="28" height="18" rx="1"/>
  <text class="tiny" x="555" y="337">PANEL POWER SWITCH — CUT TO SELECTED PART</text>
  <rect class="guide" x="375" y="290" width="210" height="100" rx="4"/>
  <text class="label" x="378" y="300">DISPLAY / SERVICE AREA — NO DEFAULT CUT</text>
  <text class="tiny" x="378" y="306">Mark and cut only after selecting the actual display, inlet harness, vents and fasteners.</text>

  <!-- Addresses 0–9: ten visible sefirot, 5.2 mm holes -->
  <g class="cut">
    <circle cx="180" cy="55" r="2.6"/><circle cx="265" cy="110" r="2.6"/><circle cx="95" cy="110" r="2.6"/>
    <circle cx="265" cy="195" r="2.6"/><circle cx="95" cy="195" r="2.6"/><circle cx="180" cy="230" r="2.6"/>
    <circle cx="265" cy="285" r="2.6"/><circle cx="95" cy="285" r="2.6"/><circle cx="180" cy="340" r="2.6"/><circle cx="180" cy="385" r="2.6"/>
    <!-- Address 10: Da'at is deliberately smaller, 2.5 mm aperture -->
    <circle cx="180" cy="145" r="1.25"/>
    <!-- Addresses 11–32: paths -->
    <circle cx="152" cy="76" r="2.6"/><circle cx="208" cy="76" r="2.6"/><circle cx="180" cy="82" r="2.6"/>
    <circle cx="135" cy="110" r="2.6"/><circle cx="225" cy="110" r="2.6"/><circle cx="180" cy="112" r="2.6"/>
    <circle cx="265" cy="152" r="2.6"/><circle cx="95" cy="152" r="2.6"/><circle cx="180" cy="187" r="2.6"/>
    <circle cx="222" cy="212" r="2.6"/><circle cx="138" cy="212" r="2.6"/><circle cx="222" cy="257" r="2.6"/>
    <circle cx="138" cy="257" r="2.6"/><circle cx="265" cy="242" r="2.6"/><circle cx="95" cy="242" r="2.6"/>
    <circle cx="222" cy="312" r="2.6"/><circle cx="138" cy="312" r="2.6"/><circle cx="180" cy="285" r="2.6"/>
    <circle cx="180" cy="322" r="2.6"/><circle cx="180" cy="362" r="2.6"/><circle cx="122" cy="175" r="2.6"/><circle cx="238" cy="175" r="2.6"/>
    <!-- Addresses 33–55: registers -->
    <circle cx="398" cy="78" r="2.6"/><circle cx="414" cy="78" r="2.6"/><circle cx="430" cy="78" r="2.6"/>
    <circle cx="446" cy="78" r="2.6"/><circle cx="462" cy="78" r="2.6"/><circle cx="478" cy="78" r="2.6"/>
    <circle cx="494" cy="78" r="2.6"/><circle cx="510" cy="78" r="2.6"/><circle cx="526" cy="78" r="2.6"/>
    <circle cx="542" cy="78" r="2.6"/><circle cx="558" cy="78" r="2.6"/>
    <circle cx="398" cy="99" r="2.6"/><circle cx="414" cy="99" r="2.6"/><circle cx="430" cy="99" r="2.6"/>
    <circle cx="446" cy="99" r="2.6"/><circle cx="462" cy="99" r="2.6"/><circle cx="478" cy="99" r="2.6"/>
    <circle cx="494" cy="99" r="2.6"/><circle cx="510" cy="99" r="2.6"/><circle cx="526" cy="99" r="2.6"/>
    <circle cx="542" cy="99" r="2.6"/><circle cx="558" cy="99" r="2.6"/><circle cx="574" cy="99" r="2.6"/>
  </g>
  <g class="address">
    <text x="180" y="50">0</text><text x="265" y="105">1</text><text x="95" y="105">2</text><text x="265" y="190">3</text><text x="95" y="190">4</text><text x="180" y="225">5</text><text x="265" y="280">6</text><text x="95" y="280">7</text><text x="180" y="335">8</text><text x="180" y="380">9</text><text x="180" y="141">10 / DA'AT</text>
    <text x="152" y="71">11</text><text x="208" y="71">12</text><text x="180" y="77">13</text><text x="135" y="105">14</text><text x="225" y="105">15</text><text x="180" y="107">16</text><text x="265" y="147">17</text><text x="95" y="147">18</text><text x="180" y="182">19</text><text x="222" y="207">20</text><text x="138" y="207">21</text><text x="222" y="252">22</text><text x="138" y="252">23</text><text x="265" y="237">24</text><text x="95" y="237">25</text><text x="222" y="307">26</text><text x="138" y="307">27</text><text x="180" y="280">28</text><text x="180" y="317">29</text><text x="180" y="357">30</text><text x="122" y="170">31</text><text x="238" y="170">32</text>
    <text x="398" y="72">33</text><text x="414" y="72">34</text><text x="430" y="72">35</text><text x="446" y="72">36</text><text x="462" y="72">37</text><text x="478" y="72">38</text><text x="494" y="72">39</text><text x="510" y="72">40</text><text x="526" y="72">41</text><text x="542" y="72">42</text><text x="558" y="72">43</text>
    <text x="398" y="107">44</text><text x="414" y="107">45</text><text x="430" y="107">46</text><text x="446" y="107">47</text><text x="462" y="107">48</text><text x="478" y="107">49</text><text x="494" y="107">50</text><text x="510" y="107">51</text><text x="526" y="107">52</text><text x="542" y="107">53</text><text x="558" y="107">54</text><text x="574" y="107">55</text>
  </g>
  <text class="tiny" x="20" y="410">MANDATORY PRE-CUT CHECK: measure calibration bar; test one 5.2 mm pixel hole and one 14 mm switch cutout in scrap; confirm selected hardware lot.</text>
</svg>
