<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">QEC-1 low-voltage wiring schematic</title>
  <desc id="desc">Separate five-volt host and panel supplies, fused panel switch, Raspberry Pi Pico 2, logic level shifter, 56 addressable indicators, key matrix, and required grounding and protection components.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06100e"/><stop offset="1" stop-color="#10231f"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#eee9dc"/></marker></defs>
  <rect width="1400" height="920" rx="28" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="50" y="62" fill="#d4b46a" font-size="18" letter-spacing="4">QEC-1 LOW-VOLTAGE WIRING</text>
    <text x="50" y="91" fill="#9ba9a3" font-size="13">Two external 5 V domains · no mains inside enclosure · verify actual module pin labels</text>

    <g transform="translate(55 145)">
      <rect width="320" height="250" rx="22" fill="#0b1916" stroke="#70c9c1"/>
      <text x="24" y="38" fill="#70c9c1" font-size="13" letter-spacing="2">HOST_5V</text>
      <rect x="24" y="70" width="272" height="58" rx="10" fill="#07110f" stroke="#d4b46a" stroke-opacity=".5"/>
      <text x="160" y="95" fill="#eee9dc" font-size="14" text-anchor="middle">Certified USB-C 5 V / 5 A</text>
      <text x="160" y="116" fill="#9ba9a3" font-size="11" text-anchor="middle">external supply</text>
      <path d="M160 128V158" stroke="#eee9dc" stroke-width="3" marker-end="url(#a)"/>
      <rect x="65" y="165" width="190" height="58" rx="10" fill="#10231f" stroke="#70c9c1"/>
      <text x="160" y="190" fill="#eee9dc" font-size="16" text-anchor="middle">Raspberry Pi 5</text>
      <text x="160" y="211" fill="#9ba9a3" font-size="11" text-anchor="middle">active cooling required</text>
    </g>

    <g transform="translate(425 145)">
      <rect width="400" height="250" rx="22" fill="#0b1916" stroke="#70c9c1"/>
      <text x="24" y="38" fill="#70c9c1" font-size="13" letter-spacing="2">CONTROL + LOGIC</text>
      <rect x="26" y="76" width="150" height="72" rx="10" fill="#10231f" stroke="#d4b46a" stroke-opacity=".55"/>
      <text x="101" y="105" fill="#eee9dc" font-size="15" text-anchor="middle">Pico 2</text>
      <text x="101" y="128" fill="#9ba9a3" font-size="11" text-anchor="middle">USB powered</text>
      <rect x="224" y="76" width="150" height="72" rx="10" fill="#10231f" stroke="#d4b46a" stroke-opacity=".55"/>
      <text x="299" y="105" fill="#eee9dc" font-size="14" text-anchor="middle">74AHCT125</text>
      <text x="299" y="128" fill="#9ba9a3" font-size="11" text-anchor="middle">3.3 V → 5 V data</text>
      <path d="M176 112H214" stroke="#d4b46a" stroke-width="3" marker-end="url(#a)"/>
      <text x="195" y="98" fill="#9ba9a3" font-size="10" text-anchor="middle">GPIO</text>
      <rect x="26" y="174" width="348" height="48" rx="10" fill="#07110f" stroke="#70c9c1" stroke-opacity=".45"/>
      <text x="200" y="203" fill="#eee9dc" font-size="13" text-anchor="middle">6 × 4 key matrix · 24 switches · 24 diodes</text>
      <path d="M101 148V164" stroke="#70c9c1" stroke-width="3" marker-end="url(#a)"/>
    </g>
    <path d="M375 310H414" stroke="#70c9c1" stroke-width="4" marker-end="url(#a)"/>
    <text x="394" y="292" fill="#70c9c1" font-size="10" text-anchor="middle">USB</text>

    <g transform="translate(875 145)">
      <rect width="470" height="250" rx="22" fill="#0b1916" stroke="#d4b46a"/>
      <text x="24" y="38" fill="#d4b46a" font-size="13" letter-spacing="2">PANEL_5V</text>
      <rect x="24" y="70" width="130" height="58" rx="10" fill="#07110f" stroke="#d4b46a" stroke-opacity=".55"/>
      <text x="89" y="95" fill="#eee9dc" font-size="13" text-anchor="middle">5 V / 5 A</text>
      <text x="89" y="116" fill="#9ba9a3" font-size="10" text-anchor="middle">external regulated</text>
      <rect x="188" y="70" width="92" height="58" rx="10" fill="#07110f" stroke="#fb7185"/>
      <text x="234" y="95" fill="#fb7185" font-size="13" text-anchor="middle">F1 · 5 A</text>
      <text x="234" y="116" fill="#9ba9a3" font-size="10" text-anchor="middle">fuse</text>
      <rect x="314" y="70" width="130" height="58" rx="10" fill="#07110f" stroke="#d4b46a" stroke-opacity=".55"/>
      <text x="379" y="95" fill="#eee9dc" font-size="13" text-anchor="middle">SW1</text>
      <text x="379" y="116" fill="#9ba9a3" font-size="10" text-anchor="middle">panel power</text>
      <path d="M154 99H178M280 99H304" stroke="#d4b46a" stroke-width="4" marker-end="url(#a)"/>
      <rect x="24" y="164" width="420" height="58" rx="10" fill="#10231f" stroke="#d4b46a" stroke-opacity=".55"/>
      <text x="234" y="188" fill="#eee9dc" font-size="13" text-anchor="middle">PANEL DISTRIBUTION · +5 V / GND</text>
      <text x="234" y="209" fill="#9ba9a3" font-size="10" text-anchor="middle">1,000 µF capacitor at rail entry</text>
      <path d="M379 128V154" stroke="#d4b46a" stroke-width="4" marker-end="url(#a)"/>
    </g>

    <g transform="translate(190 510)">
      <rect width="1020" height="250" rx="22" fill="#081512" stroke="#d4b46a" stroke-opacity=".55"/>
      <text x="28" y="42" fill="#d4b46a" font-size="13" letter-spacing="2">56-INDICATOR CHAIN / CANONICAL ADDRESS ORDER</text>
      <g transform="translate(30 80)">
        <rect width="210" height="100" rx="12" fill="#10231f" stroke="#70c9c1" stroke-opacity=".5"/>
        <text x="105" y="37" fill="#eee9dc" font-size="18" text-anchor="middle">0–10</text>
        <text x="105" y="64" fill="#9ba9a3" font-size="12" text-anchor="middle">10 sefirot + Da’at</text>
        <text x="105" y="84" fill="#9ba9a3" font-size="10" text-anchor="middle">power injection A</text>
      </g>
      <g transform="translate(270 80)">
        <rect width="210" height="100" rx="12" fill="#10231f" stroke="#70c9c1" stroke-opacity=".5"/>
        <text x="105" y="37" fill="#eee9dc" font-size="18" text-anchor="middle">11–32</text>
        <text x="105" y="64" fill="#9ba9a3" font-size="12" text-anchor="middle">22 path indicators</text>
        <text x="105" y="84" fill="#9ba9a3" font-size="10" text-anchor="middle">Aleph → Tav</text>
      </g>
      <g transform="translate(510 80)">
        <rect width="210" height="100" rx="12" fill="#10231f" stroke="#70c9c1" stroke-opacity=".5"/>
        <text x="105" y="37" fill="#eee9dc" font-size="18" text-anchor="middle">33–54</text>
        <text x="105" y="64" fill="#9ba9a3" font-size="12" text-anchor="middle">22 visible registers</text>
        <text x="105" y="84" fill="#9ba9a3" font-size="10" text-anchor="middle">power injection B</text>
      </g>
      <g transform="translate(750 80)">
        <rect width="210" height="100" rx="12" fill="#10231f" stroke="#a78bfa" stroke-opacity=".6"/>
        <text x="105" y="37" fill="#eee9dc" font-size="18" text-anchor="middle">55 · א∞</text>
        <text x="105" y="64" fill="#9ba9a3" font-size="12" text-anchor="middle">Aleph Olam metadata</text>
        <text x="105" y="84" fill="#a78bfa" font-size="10" text-anchor="middle">DISPLAY ONLY · LOCKED</text>
      </g>
      <path d="M240 130H260M480 130H500M720 130H740" stroke="#70c9c1" stroke-width="3" marker-end="url(#a)"/>
    </g>

    <path d="M724 293C800 293 820 488 300 488V500" fill="none" stroke="#70c9c1" stroke-width="3" marker-end="url(#a)"/>
    <text x="760" y="330" fill="#70c9c1" font-size="11">5 V DATA</text>
    <text x="760" y="348" fill="#9ba9a3" font-size="10">330–470 Ω at first pixel</text>
    <path d="M1109 395V500" stroke="#d4b46a" stroke-width="4" marker-end="url(#a)"/>
    <text x="1130" y="450" fill="#d4b46a" font-size="11">+5 V / GND</text>
    <path d="M924 395C924 450 715 450 715 500" fill="none" stroke="#d4b46a" stroke-width="3" marker-end="url(#a)"/>

    <rect x="190" y="805" width="1020" height="66" rx="16" fill="#fb7185" fill-opacity=".06" stroke="#fb7185" stroke-opacity=".6"/>
    <text x="700" y="832" fill="#fb7185" font-size="13" letter-spacing="2" text-anchor="middle">DO NOT JOIN HOST_5V AND PANEL_5V POSITIVE RAILS</text>
    <text x="700" y="855" fill="#9ba9a3" font-size="12" text-anchor="middle">Common logic ground is required at the level shifter. Verify all actual module pin labels before energizing.</text>
  </g>
</svg>
