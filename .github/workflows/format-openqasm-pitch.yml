name: Format and verify OpenQASM pitch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-openqasm-pitch.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format pitch files
        run: npx prettier --write index.html docs/OPENQASM_COLLABORATION.md
      - name: Verify release
        run: npm run release:check
      - name: Remove one-time workflow
        run: rm .github/workflows/format-openqasm-pitch.yml
      - name: Commit verified pitch
        run: |
          git config user.name "QEC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html docs/OPENQASM_COLLABORATION.md .github/workflows/format-openqasm-pitch.yml
          git commit -m "Verify OpenQASM collaboration pitch"
          git push origin main
