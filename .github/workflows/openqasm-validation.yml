name: OpenQASM compatibility validation

on:
  push:
    paths:
      - src/openqasm.ts
      - tests/openqasm.test.ts
      - tests/fixtures/openqasm/**
      - scripts/validate-openqasm.py
      - requirements-openqasm-validation.txt
      - .github/workflows/openqasm-validation.yml
  pull_request:
    paths:
      - src/openqasm.ts
      - tests/openqasm.test.ts
      - tests/fixtures/openqasm/**
      - scripts/validate-openqasm.py
      - requirements-openqasm-validation.txt
      - .github/workflows/openqasm-validation.yml

jobs:
  external-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-openqasm-validation.txt
      - run: python -m pip install -r requirements-openqasm-validation.txt
      - name: Pin independent Rust front end
        run: |
          git clone https://github.com/Qiskit/openqasm3_parser.git /tmp/openqasm3_parser
          git -C /tmp/openqasm3_parser checkout 3eac9970f37baf6d030a3a185b9421cca3cf0a59
      - name: Validate canonical QASM
        run: |
          python scripts/validate-openqasm.py \
            --rust-parser-dir /tmp/openqasm3_parser \
            --json-output /tmp/openqasm-validation.json \
            --markdown-output /tmp/openqasm-validation.md
