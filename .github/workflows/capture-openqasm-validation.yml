name: Capture OpenQASM validation evidence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-openqasm-validation.yml

permissions:
  contents: write

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-openqasm-validation.txt
      - run: npm ci
      - run: python -m pip install -r requirements-openqasm-validation.txt
      - name: Pin independent Rust front end
        run: |
          git clone https://github.com/Qiskit/openqasm3_parser.git /tmp/openqasm3_parser
          git -C /tmp/openqasm3_parser checkout 3eac9970f37baf6d030a3a185b9421cca3cf0a59
          rustc --version
          cargo --version
      - name: Validate canonical QASM externally
        run: python scripts/validate-openqasm.py --rust-parser-dir /tmp/openqasm3_parser
      - name: Format captured evidence
        run: npx prettier --write tests/openqasm.test.ts evidence/openqasm-validation-v0.1.json docs/OPENQASM_VALIDATION.md
      - name: Verify complete QEC release
        run: npm run release:check
      - name: Remove one-time capture workflow
        run: rm .github/workflows/capture-openqasm-validation.yml
      - name: Commit external validation evidence
        run: |
          git config user.name "QEC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Capture external OpenQASM validation evidence"
          git push origin main
