name: Bind OpenQASM evidence into Run Passport

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bind-openqasm-evidence.yml
      - .github/bind_openqasm_evidence.py

permissions:
  contents: write

jobs:
  bind-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind captured validation evidence
        run: python .github/bind_openqasm_evidence.py
      - name: Format modified contracts
        run: npx prettier --write src/passport.ts tests/passport.test.ts tests/ivritcode-machine-bridge.test.ts specifications/schemas/qec-run-passport-v0.1.schema.json vite.config.ts docs/RELEASE_READINESS.md docs/OPENQASM_COLLABORATION.md index.html
      - name: Verify complete release
        run: npm run release:check
      - name: Remove one-time helper
        run: rm .github/workflows/bind-openqasm-evidence.yml .github/bind_openqasm_evidence.py
      - name: Commit verified evidence binding
        run: |
          git config user.name "QEC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bind OpenQASM validation into Run Passport"
          git pull --rebase origin main
          git push origin main
