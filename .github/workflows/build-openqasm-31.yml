name: Build parallel OpenQASM 3.1 profile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-openqasm-31.yml

permissions:
  contents: write

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-openqasm-validation.txt
      - run: npm ci
      - run: python -m pip install -r requirements-openqasm-validation.txt
      - name: Pin independent Rust front end
        run: |
          git clone https://github.com/Qiskit/openqasm3_parser.git /tmp/openqasm3_parser
          git -C /tmp/openqasm3_parser checkout 3eac9970f37baf6d030a3a185b9421cca3cf0a59
      - name: Build 3.1 companion profile
        run: python .github/build_openqasm_31.py
      - name: Keep permanent workflow for separate privileged update
        run: git checkout -- .github/workflows/openqasm-validation.yml
      - name: Normalize fixture assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/openqasm.test.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'expect(qasm).toBe(fixture("./fixtures/openqasm/or-seed-09.qasm"));',
              'expect(qasm).toBe(fixture("./fixtures/openqasm/or-seed-09.qasm").trimEnd());',
          )
          text = text.replace(
              'expect(q31).toBe(fixture("./fixtures/openqasm31/shalom-seed-17.qasm"));',
              'expect(q31).toBe(fixture("./fixtures/openqasm31/shalom-seed-17.qasm").trimEnd());',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format implementation and contracts
        run: npx prettier --write src/openqasm.ts specifications/ivritcode-openqasm-v0.2.json specifications/schemas/ivritcode-openqasm-v0.2.schema.json tests/openqasm.test.ts tests/contracts.test.ts docs/RELEASE_READINESS.md docs/OPENQASM_COLLABORATION.md index.html
      - name: Verify software release gate
        run: npm run release:check
      - name: Capture 3.0 / 3.1 external matrix
        run: python scripts/validate-openqasm.py --rust-parser-dir /tmp/openqasm3_parser --allow-failures
      - name: Format captured matrix
        run: npx prettier --write evidence/openqasm-validation-matrix-v0.2.json docs/OPENQASM_30_31_MATRIX.md
      - name: Verify release after evidence capture
        run: npm run release:check
      - name: Remove one-time builders
        run: rm .github/build_openqasm_31.py .github/workflows/build-openqasm-31.yml
      - name: Commit 3.1 profile and evidence
        run: |
          git config user.name "QEC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add experimental OpenQASM 3.1 companion profile"
          git pull --rebase origin main
          git push origin main
