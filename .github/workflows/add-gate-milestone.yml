name: Publish Gate milestone

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-gate-milestone.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python .github/add_gate_milestone.py
      - run: npx prettier --write index.html tests/landing-interaction.test.ts
      - run: npm ci
      - run: npm run release:check
      - run: |
          git config user.name "QEC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-gate-milestone.yml .github/add_gate_milestone.py
          git add index.html tests/landing-interaction.test.ts
          git commit -m "Surface QEC Gate evidence milestone"
          git push origin main
