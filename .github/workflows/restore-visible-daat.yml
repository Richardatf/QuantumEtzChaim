name: Restore visible Daat

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-visible-daat.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python .github/restore_visible_daat.py
      - run: npx prettier --write index.html console.html src/console.ts tests/landing-interaction.test.ts tests/hardware.test.ts docs/QEC_1_FABRICATION_PACK.md
      - run: npm ci
      - run: npm run release:check
      - run: |
          git config user.name "QEC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/restore-visible-daat.yml .github/restore_visible_daat.py
          git add index.html console.html src/console.ts tests/landing-interaction.test.ts tests/hardware.test.ts docs/QEC_1_FABRICATION_PACK.md
          git commit -m "Restore visible distinct Da'at boundary"
          git push origin main
